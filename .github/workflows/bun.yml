name: Bun CI

on:
  schedule:
    - cron: '0 13 * * 1'
  push:
    branches: [nightly, release]
  pull_request:
    branches: [nightly, release]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Bun sample
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install
      - name: Run linter
        run: bun lint
      # `bun run test` is HERMETIC and is the gate -- the one definition every
      # contributor doc names. The three suites that call api.audible.com for
      # real live in `test:audible` and run non-blocking below: they cannot tell
      # "our parser broke" from "the publisher edited a blurb" (measured
      # 2026-08-22: green at 2431/0 in the morning, red that afternoon with NO
      # code change, because Audible rewrote the Harry Potter description). The
      # two Audible SCRAPE suites mock the transport and parse fixture HTML, so
      # they stay in the gate -- a first split moved the whole tree out and made
      # a ScrapeHelper regression mergeable.
      - name: Run tests
        run: bun run test
      - name: Run build
        run: bun run build

  # PHASE 0 OF THE SINGLE-CONTAINER MIGRATION: the persistence oracle.
  #
  # The unit suite mocks the models at file scope, so nothing in `bun run test`
  # exercises real persistence -- a broken storage adapter passes all of it.
  # This job runs tests-integration/ against a DISPOSABLE mongo service. When
  # the SQLite backend lands (plan Phase 2), a second matrix leg runs the SAME
  # suite against it; the two-backend green is the substitution proof.
  #
  # Deliberately a separate job and a separate `bun test` invocation: the unit
  # run's file-scope mock.module calls leak across files within one process, so
  # these tests must never share a process with them.
  integration:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Persistence integration (mongo)
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install
      - name: Run persistence integration tests (mongo)
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
        run: bun run test:integration
      # The SAME oracle against the sqlite adapter — no service needed. The
      # two-backend green is the migration's substitution proof (plan Phase 2).
      - name: Run persistence integration tests (sqlite)
        env:
          DB_BACKEND: sqlite
        run: bun run test:integration
      # Phase 4's migration script, self-tested end to end against the same
      # disposable mongo: seeds a known corpus (incl. a legacy region-less doc
      # and dead author ObjectId fields), migrates, and requires the script's
      # own count/floor/field-diff verification to pass. The script must be
      # PROVEN here before it ever runs against production data.
      - name: Migration script smoke (mongo -> sqlite)
        env:
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true
          SQLITE_PATH: /tmp/migrate-smoke.db
        run: bun scripts/migrateToSqlite.ts --smoke

  # THE LIVE THIRD-PARTY SUITE, deliberately non-blocking.
  #
  # tests/audible drives a real StitchHelper against api.audible.com and compares
  # the result to a fixture with toEqual. Publishers edit marketing copy whenever
  # they like, so a red here means "the response changed", which is USEFUL to see
  # and WRONG to gate on: on 2026-08-22 Audible rewrote the Harry Potter blurb
  # ("A new era of Hogwarts begins...") and added a subtitle field, turning the
  # repo's gate red with nothing committed.
  #
  # continue-on-error, so drift is surfaced as a signal rather than a block. When
  # this job is red, read the diff before assuming a regression: a failure named
  # "returned the correct data" is a fixture-vs-live CONTENT diff, and running the
  # helper directly (new StitchHelper(asin,'us').process()) will succeed. Note also
  # that a REGION_UNAVAILABLE error from ApiHelper.parseResponse is the
  # fall-through after baseShape.safeParse fails -- it usually means our schema
  # missed a field, not that the product is region-locked.
  #
  # Separate job, not just a separate step: like the integration job, this keeps it
  # out of a process where the unit run's file-scope mock.module calls leak.
  audible-live:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Audible live (non-blocking drift check)
    continue-on-error: true
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun install
      - name: Run live Audible tests
        run: bun run test:audible
