name: Bun CI

on:
  schedule:
    - cron: '0 13 * * 1'
  push:
    branches: [nightly, release]
  pull_request:
    branches: [nightly, release]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Bun sample
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Run linter
        run: bun lint
      - name: Run tests
        run: bun run test
      - name: Run build
        run: bun run build

  # PHASE 0 OF THE SINGLE-CONTAINER MIGRATION: the persistence oracle.
  #
  # The unit suite mocks the models at file scope, so nothing in `bun run test`
  # exercises real persistence -- a broken storage adapter passes all of it.
  # This job runs tests-integration/ against a DISPOSABLE mongo service. When
  # the SQLite backend lands (plan Phase 2), a second matrix leg runs the SAME
  # suite against it; the two-backend green is the substitution proof.
  #
  # Deliberately a separate job and a separate `bun test` invocation: the unit
  # run's file-scope mock.module calls leak across files within one process, so
  # these tests must never share a process with them.
  integration:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Persistence integration (mongo)
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install
      - name: Run persistence integration tests (mongo)
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017/?directConnection=true
        run: bun run test:integration
      # The SAME oracle against the sqlite adapter — no service needed. The
      # two-backend green is the migration's substitution proof (plan Phase 2).
      - name: Run persistence integration tests (sqlite)
        env:
          DB_BACKEND: sqlite
        run: bun run test:integration
      # Phase 4's migration script, self-tested end to end against the same
      # disposable mongo: seeds a known corpus (incl. a legacy region-less doc
      # and dead author ObjectId fields), migrates, and requires the script's
      # own count/floor/field-diff verification to pass. The script must be
      # PROVEN here before it ever runs against production data.
      - name: Migration script smoke (mongo -> sqlite)
        env:
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true
          SQLITE_PATH: /tmp/migrate-smoke.db
        run: bun scripts/migrateToSqlite.ts --smoke
